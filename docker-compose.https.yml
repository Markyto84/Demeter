# Complemento para o servidor Linux já publicado com docker-compose.prod.yml.
# Não execute para substituir a instalação Windows ou criar outro banco vazio.
services:
  frontend:
    environment:
      DEMETER_HOSTNAME: ${DEMETER_HOSTNAME:?Informe o nome DNS da aplicação}
      DEMETER_URL_PUBLICA: ${URL_PUBLICA:-https://${DEMETER_HOSTNAME}}
    ports:
      - "${DEMETER_PORTA_HTTPS:-443}:443"
    volumes:
      - ./infra/nginx-https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${DEMETER_TLS_DIR:?Informe a pasta privada com servidor.pem e chave.pem}:/etc/nginx/demeter-tls:ro
